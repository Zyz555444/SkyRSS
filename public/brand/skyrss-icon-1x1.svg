<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="SkyRSS Icon">
  <defs>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="icon-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#icon-gradient)" filter="url(#icon-shadow)"/>
  
  <!-- RSS signal waves -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <!-- Inner wave -->
    <path d="M192 336a24 24 0 0 1 24-24" stroke-width="18" stroke-opacity="0.9"/>
    <!-- Middle wave -->
    <path d="M160 336a56 56 0 0 1 56-56" stroke-width="18" stroke-opacity="0.7"/>
    <!-- Outer wave -->
    <path d="M160 336a88 88 0 0 1 88-88" stroke-width="18" stroke-opacity="0.5"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="160" cy="336" r="20" fill="#ffffff"/>
</svg>
