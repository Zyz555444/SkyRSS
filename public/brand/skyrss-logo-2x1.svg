<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" fill="none" role="img" aria-label="SkyRSS Logo">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="logo-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Icon on left -->
  <rect x="32" y="64" width="384" height="384" rx="96" fill="url(#logo-gradient)" filter="url(#logo-shadow)"/>
  
  <!-- RSS signal waves in icon -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M176 368a20 20 0 0 1 20-20" stroke-width="16" stroke-opacity="0.9"/>
    <path d="M149 368a47 47 0 0 1 47-47" stroke-width="16" stroke-opacity="0.7"/>
    <path d="M149 368a74 74 0 0 1 74-74" stroke-width="16" stroke-opacity="0.5"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="149" cy="368" r="17" fill="#ffffff"/>
  
  <!-- Text on right -->
  <text x="480" y="320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="160" font-weight="700" letter-spacing="-2">
    <tspan fill="#1e293b">Sky</tspan><tspan fill="url(#logo-gradient)">RSS</tspan>
  </text>
</svg>
